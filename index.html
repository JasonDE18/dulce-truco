<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="theme-color" content="#0b0613">
<title>Dulce o Truco 🎃</title>

<style>
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

body {
  margin: 0;
  min-height: 100vh;
  font-family: Arial, Helvetica, sans-serif;
  background: radial-gradient(circle at top, #32104d 0%, #16091f 35%, #08050b 75%);
  color: white;
  display: flex;
  justify-content: center;
  align-items: center;
  overflow-x: hidden;
}

.app {
  width: 100%;
  max-width: 460px;
  padding: 25px 18px 35px;
  text-align: center;
}

h1 {
  margin: 0;
  font-size: clamp(28px, 8vw, 40px);
  font-weight: 900;
}

.subtitle {
  color: #cfc5d8;
  margin: 8px 0 28px;
  font-size: 15px;
}

/* RULETA */

.stage {
  position: relative;
  width: min(88vw, 390px);
  height: min(88vw, 390px);
  margin: auto;
  display: flex;
  align-items: center;
  justify-content: center;
}

.wheel {
  position: relative;
  width: 100%;
  height: 100%;
  border-radius: 50%;
  overflow: hidden;
  border: 7px solid #1c1c1c;
  box-shadow: 0 10px 35px rgba(0,0,0,.55), inset 0 0 0 3px rgba(255,255,255,.15);

  background: conic-gradient(
    from -18deg,
    #f97316 0deg 36deg,
    #4c1d95 36deg 72deg,
    #f97316 72deg 108deg,
    #4c1d95 108deg 144deg,
    #f97316 144deg 180deg,
    #4c1d95 180deg 216deg,
    #f97316 216deg 252deg,
    #4c1d95 252deg 288deg,
    #f97316 288deg 324deg,
    #4c1d95 324deg 360deg
  );

  transition: transform 5s cubic-bezier(.12,.72,.08,1);
}

.wheel::after {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: 50%;
  background: repeating-conic-gradient(
    from -18deg,
    rgba(255,255,255,.45) 0deg 1deg,
    transparent 1deg 36deg
  );
  pointer-events: none;
  z-index: 5;
}

.label {
  position: absolute;
  left: 50%;
  top: 50%;
  width: 0;
  height: 0;
  z-index: 3;
}

.label span {
  position: absolute;
  width: 110px;
  left: -55px;
  top: -14px;
  font-weight: 900;
  font-size: clamp(11px,3.2vw,15px);
  white-space: nowrap;
  text-shadow: 0 2px 3px #000, 0 0 5px rgba(0,0,0,.7);
}

.hub {
  position: absolute;
  width: 82px;
  height: 82px;
  border-radius: 50%;
  background: radial-gradient(circle,#27272a,#09090b);
  border: 5px solid white;
  display: flex;
  justify-content: center;
  align-items: center;
  font-size: 39px;
  z-index: 10;
  box-shadow: 0 5px 15px rgba(0,0,0,.5);
}

.pointer {
  position: absolute;
  top: -7px;
  left: 50%;
  transform: translateX(-50%);
  width: 0;
  height: 0;
  border-left: 20px solid transparent;
  border-right: 20px solid transparent;
  border-top: 43px solid white;
  z-index: 20;
  filter: drop-shadow(0 3px 3px rgba(0,0,0,.6));
}

#result {
  min-height: 55px;
  margin-top: 22px;
  font-size: 28px;
  font-weight: 900;
  display: flex;
  align-items: center;
  justify-content: center;
}

.pop {
  animation: pop .5s ease-out;
}

@keyframes pop {
  0% { transform: scale(.5); }
  65% { transform: scale(1.2); }
  100% { transform: scale(1); }
}

button {
  width: 100%;
  margin-top: 5px;
  padding: 17px;
  border: none;
  border-radius: 16px;
  background: linear-gradient(135deg,#f97316,#ea580c);
  color: white;
  font-size: 19px;
  font-weight: 900;
  cursor: pointer;
  box-shadow: 0 6px 18px rgba(249,115,22,.35);
  transition: transform .15s, opacity .15s;
}

button:active {
  transform: scale(.96);
}

button:disabled {
  opacity: .65;
}

.footer {
  margin-top: 16px;
  color: #a99caf;
  font-size: 12px;
}

/* DULCES */

.candy {
  position: absolute;
  left: 50%;
  top: 50%;
  font-size: 28px;
  z-index: 50;
  pointer-events: none;
  animation: candyFly 1.4s ease-out forwards;
}

@keyframes candyFly {
  0% {
    opacity: 1;
    transform: translate(0,0) rotate(0deg) scale(.5);
  }
  40% { opacity: 1; }
  100% {
    opacity: 0;
    transform: translate(var(--x),var(--y)) rotate(360deg) scale(1.3);
  }
}

/* JUMPSCARE */

#jumpscare {
  position: fixed;
  inset: 0;
  width: 100vw;
  height: 100vh;
  background: #000;
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 999999;
  overflow: hidden;
}

#jumpscare.active {
  display: flex;
  animation: flashScare .12s linear;
}

#jumpscare img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  filter: contrast(1.25) brightness(1.1);
}

#jumpscare.active img {
  animation: scareImage .13s infinite alternate;
}

@keyframes flashScare {
  0% { filter: brightness(4); }
  100% { filter: brightness(1); }
}

@keyframes scareImage {
  0% { transform: scale(1.15) translate(-5px,3px) rotate(-.5deg); }
  25% { transform: scale(1.22) translate(7px,-5px) rotate(.7deg); }
  50% { transform: scale(1.18) translate(-8px,-2px) rotate(-.4deg); }
  75% { transform: scale(1.25) translate(5px,6px) rotate(.5deg); }
  100% { transform: scale(1.20) translate(-4px,-6px) rotate(-.6deg); }
}

/* POPUP DEL DEMONIO */

#prizePopup {
  position: fixed;
  inset: 0;
  z-index: 1000000;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 20px;
  background: rgba(0,0,0,.88);
  backdrop-filter: blur(7px);
}

#prizePopup.show {
  display: flex;
  animation: popupFade .4s ease-out;
}

.prize-card {
  width: 100%;
  max-width: 360px;
  padding: 28px 22px;
  text-align: center;
  border: 2px solid #a32929;
  border-radius: 22px;
  background: radial-gradient(circle at top,#451020,#160813 65%,#080408);
  box-shadow: 0 0 35px rgba(255,0,0,.35);
  animation: demonPop .55s cubic-bezier(.2,1.5,.4,1);
}

.demon {
  font-size: 90px;
  line-height: 1.2;
  filter: drop-shadow(0 0 18px red);
  animation: demonFloat 1.2s infinite alternate;
}

.prize-title {
  margin: 16px 0 10px;
  color: #ff9b27;
  font-size: 29px;
  font-weight: 1000;
  text-shadow: 0 0 15px rgba(255,100,0,.6);
}

.prize-message {
  margin: 12px 0 22px;
  color: #ff4545;
  font-size: 23px;
  line-height: 1.3;
  font-weight: 1000;
  text-shadow: 0 0 12px rgba(255,0,0,.5);
}

.prize-note {
  color: #d4bdce;
  font-size: 14px;
  margin-bottom: 20px;
}

#acceptPrize {
  background: linear-gradient(135deg,#a30016,#4b000c);
  border: 1px solid #ff5555;
  box-shadow: 0 0 20px rgba(255,0,0,.3);
}

@keyframes popupFade {
  from { opacity: 0; }
  to { opacity: 1; }
}

@keyframes demonPop {
  0% { transform: scale(.4) rotate(-8deg); }
  70% { transform: scale(1.06) rotate(2deg); }
  100% { transform: scale(1) rotate(0); }
}

@keyframes demonFloat {
  from { transform: translateY(0) rotate(-3deg); }
  to { transform: translateY(-7px) rotate(3deg); }
}

@media(max-width:360px) {
  .app {
    padding-left: 10px;
    padding-right: 10px;
  }

  .label span {
    font-size: 10px;
    width: 90px;
    left: -45px;
  }
}
</style>
</head>

<body>

<!-- JUMPSCARE -->
<div id="jumpscare">
  <img src="susto.jpg" alt="">
</div>

<audio id="scareAudio" preload="auto" src="audio.mp3"></audio>

<!-- POPUP DEL PREMIO -->
<div id="prizePopup">
  <div class="prize-card">
    <div class="demon">👹</div>
    <div class="prize-title">🍬 ¡GANASTE UN DULCE! 🍬</div>
    <div class="prize-message">
      RECLÁMALO CON<br>EL DEMONIO
    </div>
    <div class="prize-note">
      Él tiene tu premio... 😈
    </div>
    <button id="acceptPrize">ACEPTAR 👹</button>
  </div>
</div>

<main class="app">

  <h1>🎃 DULCE O TRUCO 👻</h1>
  <p class="subtitle">Gira la ruleta y descubre tu destino...</p>

  <div class="stage" id="stage">
    <div class="pointer"></div>

    <div class="wheel" id="wheel">

      <div class="label" style="transform:rotate(0deg) translateY(-125px)">
        <span style="transform:rotate(0deg)">🍬 DULCE</span>
      </div>

      <div class="label" style="transform:rotate(36deg) translateY(-125px)">
        <span style="transform:rotate(-36deg)">🎃 TRUCO</span>
      </div>

      <div class="label" style="transform:rotate(72deg) translateY(-125px)">
        <span style="transform:rotate(-72deg)">🍭 DULCE</span>
      </div>

      <div class="label" style="transform:rotate(108deg) translateY(-125px)">
        <span style="transform:rotate(-108deg)">👻 TRUCO</span>
      </div>

      <div class="label" style="transform:rotate(144deg) translateY(-125px)">
        <span style="transform:rotate(-144deg)">🍫 DULCE</span>
      </div>

      <div class="label" style="transform:rotate(180deg) translateY(-125px)">
        <span style="transform:rotate(-180deg)">🕷️ TRUCO</span>
      </div>

      <div class="label" style="transform:rotate(216deg) translateY(-125px)">
        <span style="transform:rotate(-216deg)">🍬 DULCE</span>
      </div>

      <div class="label" style="transform:rotate(252deg) translateY(-125px)">
        <span style="transform:rotate(-252deg)">💀 TRUCO</span>
      </div>

      <div class="label" style="transform:rotate(288deg) translateY(-125px)">
        <span style="transform:rotate(-288deg)">🍭 DULCE</span>
      </div>

      <div class="label" style="transform:rotate(324deg) translateY(-125px)">
        <span style="transform:rotate(-324deg)">🦇 TRUCO</span>
      </div>

    </div>

    <div class="hub">🎃</div>
  </div>

  <div id="result"></div>

  <button id="spin">🎡 GIRAR RULETA</button>

  <div class="footer">
    Toca el botón y deja que la suerte decida 🍬🎃
  </div>

</main>

<script>
const wheel = document.getElementById("wheel");
const button = document.getElementById("spin");
const result = document.getElementById("result");
const stage = document.getElementById("stage");
const jumpscare = document.getElementById("jumpscare");
const scareAudio = document.getElementById("scareAudio");
const prizePopup = document.getElementById("prizePopup");
const acceptPrize = document.getElementById("acceptPrize");

let rotation = 0;
let spinning = false;
let firstScare = true;
let firstPrize = true;

const sweetCenters = [0, 72, 144, 216, 288];

function vibrar(pattern) {
  if ("vibrate" in navigator) {
    navigator.vibrate(pattern);
  }
}

function candyExplosion() {
  const candies = ["🍬", "🍭", "🍫", "🍬", "🍭"];

  for (let i = 0; i < 24; i++) {
    const candy = document.createElement("span");
    candy.className = "candy";
    candy.textContent = candies[Math.floor(Math.random() * candies.length)];

    const angle = Math.random() * Math.PI * 2;
    const distance = 80 + Math.random() * 170;

    candy.style.setProperty("--x", Math.cos(angle) * distance + "px");
    candy.style.setProperty("--y", Math.sin(angle) * distance + "px");

    stage.appendChild(candy);
    setTimeout(() => candy.remove(), 1500);
  }
}

function vibracionRuleta() {
  const tiempos = [
    80, 170, 260, 350, 440, 530, 630, 730, 840,
    950, 1070, 1200, 1340, 1490, 1650, 1820,
    2000, 2200, 2410, 2640, 2880, 3140, 3420,
    3720, 4040, 4380, 4740
  ];

  tiempos.forEach(tiempo => {
    setTimeout(() => {
      if (spinning) vibrar(12);
    }, tiempo);
  });
}

function lanzarJumpscare() {
  return new Promise(resolve => {
    setTimeout(() => {
      jumpscare.classList.add("active");

      vibrar([100, 30, 100, 30, 250]);

      scareAudio.currentTime = 0;

      const playPromise = scareAudio.play();

      if (playPromise !== undefined) {
        playPromise.catch(() => {
          console.log("El navegador no permitió reproducir el audio.");
        });
      }

      setTimeout(() => {
        jumpscare.classList.remove("active");

        scareAudio.pause();
        scareAudio.currentTime = 0;

        vibrar(0);
        resolve();
      }, 1350);

    }, 650);
  });
}

function mostrarPremio() {
  prizePopup.classList.add("show");
  vibrar([100, 60, 100, 60, 180]);
}

function girarRuleta() {
  result.textContent = "👻 Girando...";

  vibrar(60);
  vibracionRuleta();

  const sweet = sweetCenters[
    Math.floor(Math.random() * sweetCenters.length)
  ];

  const variation = -7 + Math.random() * 14;
  const targetAngle = sweet + variation;

  const desiredRotation = (360 - targetAngle) % 360;

  const currentRotation =
    ((rotation % 360) + 360) % 360;

  const difference =
    (desiredRotation - currentRotation + 360) % 360;

  const extraTurns = 6 + Math.floor(Math.random() * 3);

  rotation += (360 * extraTurns) + difference;

  wheel.style.transform = "rotate(" + rotation + "deg)";

  setTimeout(() => {
    result.textContent = "🍬 ¡DULCE! 🍬";
    result.classList.add("pop");

    vibrar([120, 80, 120, 80, 280]);

    candyExplosion();

    spinning = false;
    button.disabled = false;

    // Mostrar el popup después del primer premio.
    if (firstPrize) {
      firstPrize = false;

      setTimeout(() => {
        mostrarPremio();
      }, 700);
    }

  }, 5100);
}

button.addEventListener("click", async () => {
  if (spinning) return;

  spinning = true;
  button.disabled = true;

  result.classList.remove("pop");

  if (firstScare) {
    firstScare = false;
    result.textContent = "🎃 Preparando la ruleta...";

    await lanzarJumpscare();
  }

  girarRuleta();
});

acceptPrize.addEventListener("click", () => {
  prizePopup.classList.remove("show");
  vibrar(0);
});

// También permite cerrar el popup con la tecla Escape.
document.addEventListener("keydown", event => {
  if (event.key === "Escape") {
    prizePopup.classList.remove("show");
  }
});
</script>

</body>
</html>
