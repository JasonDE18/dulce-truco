<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0"
  >

  <meta name="theme-color" content="#0b0613">

  <title>Dulce o Truco 🎃</title>

  <style>

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      min-height: 100vh;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      background:
        radial-gradient(
          circle at top,
          #32104d 0%,
          #16091f 35%,
          #08050b 75%
        );

      color: white;

      display: flex;
      justify-content: center;
      align-items: center;

      overflow-x: hidden;
    }


    .app {

      width: 100%;
      max-width: 460px;

      padding:
        25px
        18px
        35px;

      text-align: center;

    }


    h1 {

      margin: 0;

      font-size:
        clamp(
          28px,
          8vw,
          40px
        );

      font-weight: 900;

    }


    .subtitle {

      color: #cfc5d8;

      margin:
        8px
        0
        28px;

      font-size: 15px;

    }



    /* ===================================
       RULETA
    =================================== */


    .stage {

      position: relative;

      width:
        min(
          88vw,
          390px
        );

      height:
        min(
          88vw,
          390px
        );

      margin: auto;

      display: flex;

      align-items: center;

      justify-content: center;

    }



    .wheel {

      position: relative;

      width: 100%;
      height: 100%;

      border-radius: 50%;

      overflow: hidden;

      border:
        7px
        solid
        #1c1c1c;

      box-shadow:

        0
        10px
        35px
        rgba(0,0,0,.55),

        inset
        0
        0
        0
        3px
        rgba(255,255,255,.15);


      /*
      Cada segmento mide 36°.

      Empezamos en -18° para que
      el centro del primer DULCE
      quede exactamente arriba.
      */

      background:

        conic-gradient(

          from -18deg,

          #f97316 0deg 36deg,

          #4c1d95 36deg 72deg,

          #f97316 72deg 108deg,

          #4c1d95 108deg 144deg,

          #f97316 144deg 180deg,

          #4c1d95 180deg 216deg,

          #f97316 216deg 252deg,

          #4c1d95 252deg 288deg,

          #f97316 288deg 324deg,

          #4c1d95 324deg 360deg

        );


      transition:

        transform
        5s
        cubic-bezier(
          .12,
          .72,
          .08,
          1
        );

    }



    /*
    Líneas divisorias
    */

    .wheel::after {

      content: "";

      position: absolute;

      inset: 0;

      border-radius: 50%;


      background:

        repeating-conic-gradient(

          from -18deg,

          rgba(
            255,
            255,
            255,
            .45
          )
          0deg
          1deg,

          transparent
          1deg
          36deg

        );


      pointer-events: none;

      z-index: 5;

    }



    /* ===================================
       TEXTOS
    =================================== */


    .label {

      position: absolute;

      left: 50%;
      top: 50%;

      width: 0;
      height: 0;

      z-index: 3;

      pointer-events: none;

    }



    .label span {

      position: absolute;

      width: 110px;

      left: -55px;
      top: -14px;

      font-weight: 900;

      font-size:

        clamp(
          11px,
          3.2vw,
          15px
        );

      white-space: nowrap;


      text-shadow:

        0
        2px
        3px
        #000,

        0
        0
        5px
        rgba(0,0,0,.7);

    }



    /* ===================================
       CENTRO
    =================================== */


    .hub {

      position: absolute;

      width: 82px;
      height: 82px;

      border-radius: 50%;


      background:

        radial-gradient(

          circle,

          #27272a,

          #09090b

        );


      border:
        5px
        solid
        white;


      display: flex;

      justify-content: center;

      align-items: center;


      font-size: 39px;


      z-index: 10;


      box-shadow:

        0
        5px
        15px
        rgba(0,0,0,.5);

    }



    /* ===================================
       FLECHA
    =================================== */


    .pointer {

      position: absolute;

      top: -7px;

      left: 50%;

      transform:
        translateX(-50%);


      width: 0;

      height: 0;


      border-left:
        20px
        solid
        transparent;

      border-right:
        20px
        solid
        transparent;

      border-top:
        43px
        solid
        white;


      z-index: 20;


      filter:

        drop-shadow(
          0
          3px
          3px
          rgba(0,0,0,.6)
        );

    }



    /* ===================================
       RESULTADO
    =================================== */


    #result {

      min-height: 55px;

      margin-top: 22px;

      font-size: 28px;

      font-weight: 900;


      display: flex;

      align-items: center;

      justify-content: center;

    }



    .pop {

      animation:

        pop
        .5s
        ease-out;

    }



    @keyframes pop {

      0% {

        transform:
          scale(.5);

      }


      65% {

        transform:
          scale(1.2);

      }


      100% {

        transform:
          scale(1);

      }

    }



    /* ===================================
       BOTÓN
    =================================== */


    button {

      width: 100%;

      margin-top: 5px;

      padding: 17px;


      border: none;

      border-radius: 16px;


      background:

        linear-gradient(

          135deg,

          #f97316,

          #ea580c

        );


      color: white;


      font-size: 19px;

      font-weight: 900;


      cursor: pointer;


      box-shadow:

        0
        6px
        18px
        rgba(249,115,22,.35);


      transition:

        transform .15s,

        opacity .15s;

    }



    button:active {

      transform:
        scale(.96);

    }



    button:disabled {

      opacity: .65;

    }



    .footer {

      margin-top: 16px;

      color: #a99caf;

      font-size: 12px;

    }



    /* ===================================
       DULCES VOLANDO
    =================================== */


    .candy {

      position: absolute;

      left: 50%;
      top: 50%;


      font-size: 28px;


      z-index: 50;


      pointer-events: none;


      animation:

        candyFly
        1.4s
        ease-out
        forwards;

    }



    @keyframes candyFly {

      0% {

        opacity: 1;

        transform:

          translate(0,0)

          rotate(0deg)

          scale(.5);

      }


      40% {

        opacity: 1;

      }


      100% {

        opacity: 0;


        transform:

          translate(
            var(--x),
            var(--y)
          )

          rotate(360deg)

          scale(1.3);

      }

    }



    /* ===================================
       AJUSTE PARA CELULARES PEQUEÑOS
    =================================== */


    @media(max-width: 360px) {

      .app {

        padding-left: 10px;

        padding-right: 10px;

      }


      .label span {

        font-size: 10px;

        width: 90px;

        left: -45px;

      }

    }


  </style>

</head>



<body>


<main class="app">


  <h1>

    🎃 DULCE O TRUCO 👻

  </h1>


  <p class="subtitle">

    Gira la ruleta y descubre tu destino...

  </p>



  <div
    class="stage"
    id="stage"
  >


    <!-- FLECHA -->


    <div
      class="pointer"
    ></div>



    <!-- RULETA -->


    <div
      class="wheel"
      id="wheel"
    >



      <!-- DULCE -->


      <div

        class="label"

        style="
          transform:
          rotate(0deg)
          translateY(-125px);
        "

      >

        <span

          style="
            transform:
            rotate(0deg);
          "

        >

          🍬 DULCE

        </span>

      </div>



      <!-- TRUCO -->


      <div

        class="label"

        style="
          transform:
          rotate(36deg)
          translateY(-125px);
        "

      >

        <span

          style="
            transform:
            rotate(-36deg);
          "

        >

          🎃 TRUCO

        </span>

      </div>



      <!-- DULCE -->


      <div

        class="label"

        style="
          transform:
          rotate(72deg)
          translateY(-125px);
        "

      >

        <span

          style="
            transform:
            rotate(-72deg);
          "

        >

          🍭 DULCE

        </span>

      </div>



      <!-- TRUCO -->


      <div

        class="label"

        style="
          transform:
          rotate(108deg)
          translateY(-125px);
        "

      >

        <span

          style="
            transform:
            rotate(-108deg);
          "

        >

          👻 TRUCO

        </span>

      </div>



      <!-- DULCE -->


      <div

        class="label"

        style="
          transform:
          rotate(144deg)
          translateY(-125px);
        "

      >

        <span

          style="
            transform:
            rotate(-144deg);
          "

        >

          🍫 DULCE

        </span>

      </div>



      <!-- TRUCO -->


      <div

        class="label"

        style="
          transform:
          rotate(180deg)
          translateY(-125px);
        "

      >

        <span

          style="
            transform:
            rotate(-180deg);
          "

        >

          🕷️ TRUCO

        </span>

      </div>



      <!-- DULCE -->


      <div

        class="label"

        style="
          transform:
          rotate(216deg)
          translateY(-125px);
        "

      >

        <span

          style="
            transform:
            rotate(-216deg);
          "

        >

          🍬 DULCE

        </span>

      </div>



      <!-- TRUCO -->


      <div

        class="label"

        style="
          transform:
          rotate(252deg)
          translateY(-125px);
        "

      >

        <span

          style="
            transform:
            rotate(-252deg);
          "

        >

          💀 TRUCO

        </span>

      </div>



      <!-- DULCE -->


      <div

        class="label"

        style="
          transform:
          rotate(288deg)
          translateY(-125px);
        "

      >

        <span

          style="
            transform:
            rotate(-288deg);
          "

        >

          🍭 DULCE

        </span>

      </div>



      <!-- TRUCO -->


      <div

        class="label"

        style="
          transform:
          rotate(324deg)
          translateY(-125px);
        "

      >

        <span

          style="
            transform:
            rotate(-324deg);
          "

        >

          🦇 TRUCO

        </span>

      </div>


    </div>



    <!-- CENTRO -->


    <div
      class="hub"
    >

      🎃

    </div>


  </div>



  <!-- RESULTADO -->


  <div
    id="result"
  ></div>



  <!-- BOTÓN -->


  <button
    id="spin"
  >

    🎡 GIRAR RULETA

  </button>



  <div
    class="footer"
  >

    Toca el botón y deja que la suerte decida 🍬🎃

  </div>


</main>




<script>


/* =========================================
   ELEMENTOS
========================================= */


const wheel =
document.getElementById("wheel");


const button =
document.getElementById("spin");


const result =
document.getElementById("result");


const stage =
document.getElementById("stage");



let rotation = 0;


let spinning = false;



/* =========================================
   VIBRACIÓN
========================================= */


function vibrar(patron) {


  /*
  Si el navegador soporta
  vibración, la ejecutamos.
  */


  if ("vibrate" in navigator) {

    navigator.vibrate(patron);

  }

}



/* =========================================
   POSICIONES DE DULCE
========================================= */


const sweetCenters = [

  0,

  72,

  144,

  216,

  288

];



/* =========================================
   EXPLOSIÓN DE DULCES
========================================= */


function candyExplosion() {


  const candies = [

    "🍬",

    "🍭",

    "🍫",

    "🍬",

    "🍭"

  ];



  for(
    let i = 0;
    i < 24;
    i++
  ) {


    const candy =
    document.createElement(
      "span"
    );


    candy.className =
    "candy";


    candy.textContent =

      candies[

        Math.floor(

          Math.random()

          *

          candies.length

        )

      ];



    const angle =

      Math.random()

      *

      Math.PI

      *

      2;



    const distance =

      80

      +

      Math.random()

      *

      170;



    candy.style.setProperty(

      "--x",

      Math.cos(angle)

      *

      distance

      +

      "px"

    );



    candy.style.setProperty(

      "--y",

      Math.sin(angle)

      *

      distance

      +

      "px"

    );



    stage.appendChild(
      candy
    );



    setTimeout(

      function() {

        candy.remove();

      },

      1500

    );


  }

}



/* =========================================
   VIBRACIÓN DURANTE EL GIRO
========================================= */


function vibracionRuleta() {


  /*
  Los primeros clics están
  muy juntos.

  Después se separan para
  simular que la ruleta
  está perdiendo velocidad.
  */


  const tiempos = [

    80,

    170,

    260,

    350,

    440,

    530,

    630,

    730,

    840,

    950,

    1070,

    1200,

    1340,

    1490,

    1650,

    1820,

    2000,

    2200,

    2410,

    2640,

    2880,

    3140,

    3420,

    3720,

    4040,

    4380,

    4740

  ];



  tiempos.forEach(

    function(tiempo) {


      setTimeout(

        function() {


          if(spinning) {

            vibrar(12);

          }


        },

        tiempo

      );


    }

  );

}



/* =========================================
   GIRAR RULETA
========================================= */


button.addEventListener(

  "click",

  function() {



    if(spinning) {

      return;

    }



    spinning = true;



    button.disabled = true;



    result.classList.remove(
      "pop"
    );



    result.textContent =
    "👻 Girando...";



    /*
    Vibración al presionar
    el botón.
    */


    vibrar(60);



    /*
    Iniciamos las pequeñas
    vibraciones durante
    el giro.
    */


    vibracionRuleta();



    /*
    Elegimos aleatoriamente
    uno de los sectores
    DULCE.
    */


    const sweet =

      sweetCenters[

        Math.floor(

          Math.random()

          *

          sweetCenters.length

        )

      ];



    /*
    Pequeña variación.

    Evitamos acercarnos
    demasiado a las líneas
    divisorias.
    */


    const variation =

      -7

      +

      Math.random()

      *

      14;



    const targetAngle =

      sweet

      +

      variation;



    /*
    Calculamos dónde debe
    terminar la ruleta.
    */


    const desiredRotation =

      (

        360

        -

        targetAngle

      )

      %

      360;



    const currentRotation =

      (

        (

          rotation

          %

          360

        )

        +

        360

      )

      %

      360;



    const difference =

      (

        desiredRotation

        -

        currentRotation

        +

        360

      )

      %

      360;



    /*
    Entre 6 y 8 vueltas.
    */


    const extraTurns =

      6

      +

      Math.floor(

        Math.random()

        *

        3

      );



    rotation +=

      (

        360

        *

        extraTurns

      )

      +

      difference;



    /*
    Iniciamos animación.
    */


    wheel.style.transform =

      "rotate("

      +

      rotation

      +

      "deg)";



    /*
    Cuando termina el giro.
    */


    setTimeout(

      function() {



        result.textContent =

        "🍬 ¡DULCE! 🍬";



        result.classList.add(
          "pop"
        );



        /*
        Vibración especial
        de victoria.

        vibrar
        pausa
        vibrar
        pausa
        vibración larga
        */


        vibrar([

          120,

          80,

          120,

          80,

          280

        ]);



        /*
        Lanzamos dulces.
        */


        candyExplosion();



        button.disabled =
        false;



        spinning =
        false;



      },

      5100

    );


  }

);


</script>


</body>

</html>
